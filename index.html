<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WeatherMap</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⛅</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="hero">
    <h1 class="hero-title">WeatherMap</h1>
    <p class="hero-sub">Search any place and see its weather right on the map</p>
  </header>

  <main class="page">

    <form id="search-form" class="search-bar" autocomplete="off">
      <svg class="search-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <path d="M10 2a8 8 0 1 0 4.9 14.3l5.4 5.4 1.4-1.4-5.4-5.4A8 8 0 0 0 10 2zm0 2a6 6 0 1 1 0 12 6 6 0 0 1 0-12z"/>
      </svg>
      <input type="text" id="place" class="search-input" placeholder="Search for a location" aria-label="Location">
      <button type="submit" id="go-btn" class="search-btn">Get Weather</button>
    </form>

    <div id="favs" class="favs"></div>

    <div id="error-card" class="error-card hidden" role="alert">
      <p id="error-msg"></p>
      <button type="button" id="error-x" class="error-x" aria-label="Dismiss">&times;</button>
    </div>

    <div class="map-box">
      <div id="map" class="map"></div>
      <div id="loader" class="loader hidden"><div class="ring"></div></div>
    </div>

    <div id="tools" class="tools hidden">
      <button type="button" id="share-btn" class="tool-btn">Share Weather</button>
      <button type="button" id="fav-btn" class="tool-btn tool-btn-outline">Save to favorites</button>
      <span id="msg" class="msg hidden"></span>
    </div>

    <section id="forecast" class="forecast hidden">
      <h2 class="forecast-head">Next 5 days</h2>
      <div id="forecast-cards" class="forecast-cards"></div>
    </section>

  </main>

  <footer class="foot">Weather data by OpenWeatherMap &middot; Map data by OpenStreetMap</footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
